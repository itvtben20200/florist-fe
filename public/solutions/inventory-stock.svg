<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#0d3d28"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Stock level chart bars (background) -->
  <g opacity="0.08">
    <rect x="340" y="80" width="420" height="440" rx="12" fill="white"/>
  </g>

  <!-- Stock table card -->
  <rect x="340" y="60" width="430" height="460" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Table header -->
  <rect x="340" y="60" width="430" height="44" rx="14" fill="rgba(255,255,255,0.08)"/>
  <rect x="340" y="90" width="430" height="14" fill="rgba(255,255,255,0.08)"/>
  <text x="360" y="88" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)" font-weight="700" letter-spacing="2">PRODUCT</text>
  <text x="548" y="88" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)" font-weight="700" letter-spacing="2">STOCK</text>
  <text x="636" y="88" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)" font-weight="700" letter-spacing="2">STATUS</text>
  <text x="710" y="88" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)" font-weight="700" letter-spacing="2">ALERT</text>

  <!-- Row 1 – Red Roses (healthy) -->
  <rect x="341" y="104" width="428" height="42" rx="0" fill="rgba(255,255,255,0.03)"/>
  <rect x="355" y="116" width="16" height="16" rx="4" fill="#e95e6f" opacity="0.8"/>
  <text x="378" y="128" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" font-weight="600">Red Roses (stems)</text>
  <text x="548" y="128" font-family="monospace" font-size="13" fill="white" font-weight="700">240</text>
  <rect x="628" y="118" width="52" height="16" rx="8" fill="rgba(74,222,128,0.15)"/>
  <text x="654" y="130" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">OK</text>
  <text x="718" y="128" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">50</text>

  <!-- Row 2 – White Lilies (low) -->
  <rect x="341" y="146" width="428" height="42" rx="0" fill="rgba(255,255,255,0.0)"/>
  <rect x="355" y="158" width="16" height="16" rx="4" fill="#f0f0e8" opacity="0.8"/>
  <text x="378" y="170" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" font-weight="600">White Lilies (stems)</text>
  <text x="548" y="170" font-family="monospace" font-size="13" fill="#fbbf24" font-weight="700">18</text>
  <rect x="618" y="160" width="68" height="16" rx="8" fill="rgba(251,191,36,0.15)"/>
  <text x="652" y="172" font-family="monospace" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="700">LOW</text>
  <text x="718" y="170" font-family="monospace" font-size="10" fill="#fbbf24">20</text>

  <!-- Row 3 – Sunflowers (healthy) -->
  <rect x="341" y="188" width="428" height="42" rx="0" fill="rgba(255,255,255,0.03)"/>
  <rect x="355" y="200" width="16" height="16" rx="4" fill="#fde68a" opacity="0.8"/>
  <text x="378" y="212" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" font-weight="600">Sunflowers (stems)</text>
  <text x="548" y="212" font-family="monospace" font-size="13" fill="white" font-weight="700">85</text>
  <rect x="628" y="202" width="52" height="16" rx="8" fill="rgba(74,222,128,0.15)"/>
  <text x="654" y="214" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">OK</text>
  <text x="718" y="212" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">30</text>

  <!-- Row 4 – Peonies (critical) -->
  <rect x="341" y="230" width="428" height="42" rx="0" fill="rgba(233,94,111,0.06)"/>
  <rect x="355" y="242" width="16" height="16" rx="4" fill="#f9a8d4" opacity="0.8"/>
  <text x="378" y="254" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" font-weight="600">Peonies (stems)</text>
  <text x="548" y="254" font-family="monospace" font-size="13" fill="#e95e6f" font-weight="700">4</text>
  <rect x="606" y="244" width="80" height="16" rx="8" fill="rgba(233,94,111,0.2)"/>
  <text x="646" y="256" font-family="monospace" font-size="9" fill="#e95e6f" text-anchor="middle" font-weight="700">CRITICAL</text>
  <text x="718" y="254" font-family="monospace" font-size="10" fill="#e95e6f">15</text>

  <!-- Row 5 – Eucalyptus (healthy) -->
  <rect x="341" y="272" width="428" height="42" rx="0" fill="rgba(255,255,255,0.03)"/>
  <rect x="355" y="284" width="16" height="16" rx="4" fill="#86efac" opacity="0.8"/>
  <text x="378" y="296" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" font-weight="600">Eucalyptus (bunches)</text>
  <text x="548" y="296" font-family="monospace" font-size="13" fill="white" font-weight="700">32</text>
  <rect x="628" y="286" width="52" height="16" rx="8" fill="rgba(74,222,128,0.15)"/>
  <text x="654" y="298" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle" font-weight="700">OK</text>
  <text x="718" y="296" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">10</text>

  <!-- Row 6 – Rose Ribbon (low) -->
  <rect x="341" y="314" width="428" height="42" rx="0" fill="rgba(255,255,255,0.0)"/>
  <rect x="355" y="326" width="16" height="16" rx="4" fill="#c4b5fd" opacity="0.8"/>
  <text x="378" y="338" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)" font-weight="600">Ribbon – Rose Gold</text>
  <text x="548" y="338" font-family="monospace" font-size="13" fill="#fbbf24" font-weight="700">12</text>
  <rect x="618" y="328" width="68" height="16" rx="8" fill="rgba(251,191,36,0.15)"/>
  <text x="652" y="340" font-family="monospace" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="700">LOW</text>
  <text x="718" y="338" font-family="monospace" font-size="10" fill="#fbbf24">25</text>

  <!-- Divider -->
  <line x1="341" y1="356" x2="769" y2="356" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Summary row -->
  <text x="360" y="386" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">6 products shown · 2 below threshold · 1 critical</text>
  <rect x="672" y="372" width="88" height="26" rx="6" fill="#e95e6f"/>
  <text x="716" y="389" font-family="monospace" font-size="9" fill="white" text-anchor="middle" font-weight="700">REORDER →</text>

  <!-- Left info cards -->
  <!-- Total SKUs -->
  <rect x="40" y="50" width="170" height="76" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="60" y="78" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)" font-weight="700" letter-spacing="1.5">TOTAL SKUs</text>
  <text x="60" y="104" font-family="serif" font-size="30" fill="white" font-weight="400">148</text>

  <!-- In stock -->
  <rect x="40" y="142" width="170" height="76" rx="12" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.2)" stroke-width="1"/>
  <text x="60" y="170" font-family="monospace" font-size="9" fill="rgba(74,222,128,0.7)" font-weight="700" letter-spacing="1.5">IN STOCK</text>
  <text x="60" y="196" font-family="serif" font-size="30" fill="#4ade80" font-weight="400">139</text>

  <!-- Low stock -->
  <rect x="40" y="234" width="170" height="76" rx="12" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
  <text x="60" y="262" font-family="monospace" font-size="9" fill="rgba(251,191,36,0.8)" font-weight="700" letter-spacing="1.5">LOW STOCK</text>
  <text x="60" y="288" font-family="serif" font-size="30" fill="#fbbf24" font-weight="400">7</text>

  <!-- Critical -->
  <rect x="40" y="326" width="170" height="76" rx="12" fill="rgba(233,94,111,0.1)" stroke="rgba(233,94,111,0.25)" stroke-width="1"/>
  <text x="60" y="354" font-family="monospace" font-size="9" fill="rgba(233,94,111,0.8)" font-weight="700" letter-spacing="1.5">CRITICAL</text>
  <text x="60" y="380" font-family="serif" font-size="30" fill="#e95e6f" font-weight="400">2</text>

  <!-- Activity feed -->
  <rect x="40" y="430" width="270" height="120" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="60" y="456" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.35)" font-weight="700" letter-spacing="1.5">RECENT MOVEMENTS</text>
  <circle cx="56" cy="476" r="4" fill="#4ade80"/>
  <text x="68" y="480" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.6)">–24 Red Roses · Online order #4821</text>
  <circle cx="56" cy="500" r="4" fill="#e95e6f"/>
  <text x="68" y="504" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.6)">–6 Peonies · POS sale · 09:14</text>
  <circle cx="56" cy="524" r="4" fill="#60a5fa"/>
  <text x="68" y="528" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.6)">+100 Sunflowers · Supplier receipt</text>
</svg>
